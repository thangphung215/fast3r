# @package _global_

defaults:
  # - override /model: lightfast3rv2
  # - override /model: lightfast3r
  - override /model: fast3r

# seed for random number generators in pytorch, numpy and python.random
seed: 42


tags: ["train", "super_long_training"]

task_name: convnext_xlarge_sinusoidal2d_arkit_1input_1x6000Ada_20250918_30e_5000_100_arkit_scannetpp_12_10view
# task_name: test_convnextrope2d_xlarge_1input_1x6000Ada_20250918_30e_5000_100_arkit_scannetpp_12_10view_2e5
# task_name: test_convnextraw_large_1input_1x6000Ada_20250907_100e_1500_arkit_co3d_dtu_15_12view_ReduceLROnPlateau
# task_name: resnet50_rope2d_1input_1x3090_20250902_60e_1000arkit_co3d_DTU_full_12_10view
# task_name: mobilenetv4_rope2d_1input_1x3090_20250901_60e_1000arkit_co3d_DTU_full_12_16view
# task_name: test_efficientnetb3_rope2d_1input_1x4060Ti_20250830_30e_1000arkit_full_4view_deepspeedstage2
# task_name: test_convnext_rope2d_1input_1x4060Ti_20250830_30e_1000arkit_full_4view_deepspeedstage2
# task_name: resnet101_1input_1x4060Ti_20250828_2e_500arkit_co3d
# task_name: super_long_training_mobilenetv4_arkit_2inputs_test2_sum_fr_sandwich_20250812_test_tv
# task_name: super_long_training_mambavision_test_effientnetv2
# task_name: super_long_training_mambavision_benchmarkDTU
# task_name: super_long_training_mambavision_dev
# task_name: super_long_training_darknet53_dev
# task_name: super_long_training_darknet53_benchmarkDTU
# task_name: super_long_training_resnet18_benchmark
slurm_job_id: 20250816 # must set in the command line

# ckpt_path: /path/to/resume.ckpt  # uncomment to resume training from a checkpoint

paths:
  run_folder_name: ${task_name}_${slurm_job_id}_20250809

logger:
  wandb:
    name: ${task_name}_${slurm_job_id}

data:
  num_views: 12
  num_views_val: 10
  data_scaling: 1.0
  data_module:
    pin_memory: true
    num_workers: 4
    num_workers_val: 1 # have to be a low number when using DeepSpeed ZeRO-2
    batch_size_per_device: 1
    batch_size_per_device_val: 1
    train_datasets:
      # - 1_500 @ Co3d_Multiview(split='train', data_scaling=${data.data_scaling}, num_views=${data.num_views}, window_degree_range=360, num_samples_per_window=100, ROOT='${data.data_root}/co3d_all_seqs_per_category_subset_processed', aug_crop=16, mask_bg='rand', resolution=[(512, 336), (512, 288), (512, 256), (512, 160)], transform=ColorJitter)
      # - 5_00 @ Co3d_Multiview(split='train', data_scaling=${data.data_scaling}, num_views=${data.num_views}, window_degree_range=360, num_samples_per_window=100, ROOT='${data.data_root}/co3d_all_seqs_per_category_subset_processed', aug_crop=16, mask_bg='rand', resolution=[(512, 384), (512, 336), (512, 288), (512, 256), (512, 160)], transform=ColorJitter)
      - 5_0 @ ScanNetpp_Multiview(split='train', data_scaling=${data.data_scaling}, num_views=${data.num_views}, window_size=${python_eval:"${data.num_views} * 2"}, num_samples_per_window=5, ROOT='${data.data_root}/scannetpp_processed', aug_crop=256, resolution=[(512, 384), (512, 336), (512, 288), (512, 256), (512, 160)], transform=ColorJitter)
      - 5_0 @ ARKitScenes_Multiview(split='train', data_scaling=${data.data_scaling}, num_views=${data.num_views}, window_size=${python_eval:"${data.num_views} * 5"}, num_samples_per_window=5, ROOT='${data.data_root}/arkitscenes_processed', aug_crop=256, resolution=[(512, 384),(512, 336), (512, 288), (512, 256), (512, 160)], transform=ColorJitter)
      # - 1_000 @ ARKitScenes_Multiview(split='train', data_scaling=${data.data_scaling}, num_views=${data.num_views}, window_size=${python_eval:"${data.num_views} * 5"}, num_samples_per_window=5, ROOT='${data.data_root}/arkitscenes_processed', aug_crop=256, resolution=[(512, 384), (512, 336), (512, 288), (512, 256), (512, 160)], transform=ColorJitter)
      # - 80_000 @ Habitat_Multiview(1_000, split='train', data_scaling=${data.data_scaling}, num_views=${data.num_views}, ROOT='${data.data_root}/habitat_processed', aug_crop=16, resolution=[(512, 384), (512, 336), (512, 288), (512, 256), (512, 160)], transform=ColorJitter)
      # - 1_00 @ BlendMVS(split='train', num_frames=${data.num_views}, num_seq=100, ROOT='${data.data_root}/BlendedMVS/raw', resolution=[(512, 384),(512, 336), (512, 288), (512, 256), (512, 160)])
    validation_datasets:
      # - 100 @ Co3d_Multiview(split='test', num_views=${data.num_views_val}, window_degree_range=360, num_samples_per_window=100, ROOT='${data.data_root}/co3d_all_seqs_per_category_subset_processed', resolution=(512, 384), seed=777)
      - 100 @ ScanNetpp_Multiview(split='train', num_views=${data.num_views_val}, window_size=${python_eval:"${data.num_views_val} * 2"}, num_samples_per_window=1, ROOT='${data.data_root}/scannetpp_processed', resolution=(512, 384), seed=777)
      - 100 @ ARKitScenes_Multiview(split='train', num_views=${data.num_views_val}, window_size=${python_eval:"${data.num_views_val} * 5"}, num_samples_per_window=1, ROOT='${data.data_root}/arkitscenes_processed', resolution=(512, 384), seed=777)
      # - 100 @ Habitat_Multiview(100, split='val', num_views=${data.num_views_val}, ROOT='${data.data_root}/habitat_processed', resolution=(512, 384), seed=777)
      # - 50 @ BlendMVS(split='test', num_frames=${data.num_views_val}, num_seq=1, ROOT='${data.data_root}/BlendedMVS/raw', resolution=(512, 384), seed=777)
      # - DTU(split='test', ROOT='${data.data_root}/dtu_test_mvsnet_release', resolution=(512,384), num_seq=1, full_video=True, kf_every=5)
      # - SevenScenes(split='test', ROOT='${data.data_root}/7_scenes_processed', resolution=(512,384), num_seq=1, full_video=True, kf_every=20)
      # - NRGBD(split='test', ROOT='${data.data_root}/neural_rgbd', resolution=(512,384), num_seq=1, full_video=True, kf_every=40)

model:
  net:
    head_args:
      with_local_head: True
    # decoder_args:
    #   random_image_idx_embedding: true
    #   enc_embed_dim: 1024
    #   embed_dim: 256
    #   num_heads: 8
    #   depth: 12
    #   mlp_ratio: 4.0
    #   qkv_bias: true
    #   drop: 0.0
    #   attn_drop: 0.0
    #   attn_implementation: flash_attention

  train_criterion:
    _target_: fast3r.dust3r.losses.ConfLossMultiviewV2
    pixel_loss:
      _target_: fast3r.dust3r.losses.Regr3DMultiviewV4
      criterion:
        _target_: fast3r.dust3r.losses.L21Loss
      norm_mode: avg_dis
    alpha: 0.2

  validation_criterion:
    _target_: fast3r.dust3r.losses.ConfLossMultiviewV2
    pixel_loss:
      _target_: fast3r.dust3r.losses.Regr3DMultiviewV4
      criterion:
        _target_: fast3r.dust3r.losses.L21Loss
      norm_mode: avg_dis
    alpha: 0.2

trainer:
  devices: 1
  num_nodes: 1
  accelerator: auto
  max_epochs: 3
  # strategy: deepspeed_stage_2
  strategy:
    _target_: lightning.pytorch.strategies.DeepSpeedStrategy
    timeout:
      _target_: datetime.timedelta
      minutes: 12000
