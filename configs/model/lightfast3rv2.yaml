_target_: fast3r.models.multiview_dust3r_module.MultiViewDUSt3RLitModule

pretrained: ''
# resume_from_checkpoint: ${ckpt_path}

eval_use_pts3d_from_local_head: true

train_criterion:
  _target_: fast3r.dust3r.losses.ConfLossMultiviewV2
  pixel_loss:
    _target_: fast3r.dust3r.losses.Regr3DMultiviewV4
    criterion:
      _target_: fast3r.dust3r.losses.L21Loss
    norm_mode: avg_dis
  alpha: 0.2

validation_criterion:
  _target_: fast3r.dust3r.losses.ConfLossMultiviewV2
  pixel_loss:
    _target_: fast3r.dust3r.losses.Regr3DMultiviewV4
    criterion:
      _target_: fast3r.dust3r.losses.L21Loss
    norm_mode: avg_dis
  alpha: 0.2

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  betas: 
    - 0.9
    - 0.95
  weight_decay: 0.05

# scheduler:
#   _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
#   _partial_: true
#   mode: min
#   factor: 0.1
#   patience: 10

scheduler:
  _target_: pl_bolts.optimizers.lr_scheduler.LinearWarmupCosineAnnealingLR
  _partial_: true
  warmup_epochs: 5
  max_epochs: ${trainer.max_epochs}
  eta_min: 1e-06

net:
  _target_: fast3r.models.lightfast3r.LightFast3Rv2
  encoder_args:
    encoder_type: resnet101_167
    embed_dim: 3712
  decoder_args:
    decoder_type: fast3rcnn2
    random_image_idx_embedding: true
    image_idx_emb_dim: 128
    enc_embed_dim: 3712
    embed_dim: 768 
    depth: 12
  head_args:
    head_type: dpt
    output_mode: pts3d
    landscape_only: true
    depth_mode: 
      - exp
      - !!float -inf
      - !!float inf
    conf_mode: 
      - exp
      - 1
      - !!float inf
    patch_size: 16
    
  freeze: none
  # freeze: sandwich
  # freeze: head



# compile model for faster training with pytorch 2.0
compile: false
